# Configuration for MegaLinter
# https://megalinter.io/latest/config-file/
#
# Scoped to the languages/formats actually present in this repo
# (checked via `git ls-files`: .py, .yml/.yaml, .css, .js, .html,
# plus the GitHub Actions workflows themselves). Markdown and secrets
# scanning are intentionally left out of this list - they're already
# covered by this repo's dedicated markdownlint CI workflow (tuned
# config) and the DeepSource "secrets" analyzer, so enabling them
# here too would just produce duplicate/conflicting feedback on the
# same files.
ENABLE:
  - ACTION
  - CSS
  - HTML
  - JAVASCRIPT
  - PYTHON
  - YAML

# Restrict each language to one linter. MegaLinter runs every linter it
# knows for an enabled language by default (e.g. 7 different Python
# linters at once), which is slow and produces heavily overlapping
# findings. One tool per language is picked instead:
# - PYTHON_RUFF: covers most of what flake8/pylint/isort/black would
#   flag, in a single fast pass.
# - HTML_HTMLHINT over HTML_DJLINT: djlint targets templating engines
#   (Django/Jinja/Nunjucks); this repo's only HTML file is plain.
ENABLE_LINTERS:
  - ACTION_ACTIONLINT
  - CSS_STYLELINT
  - HTML_HTMLHINT
  - JAVASCRIPT_STANDARD
  - PYTHON_RUFF
  - YAML_YAMLLINT

SHOW_ELAPSED_TIME: true
FILEIO_REPORTER: false
