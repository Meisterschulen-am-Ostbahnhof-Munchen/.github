name: MegaLinter

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  megalinter:
    name: MegaLinter
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: MegaLinter Runner
        uses: oxsecurity/megalinter@e08c2b05e3dbc40af4c23f41172ef1e068a7d651  # v8.8.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VALIDATE_ALL_CODEBASE: true
          # Set here rather than only in .mega-linter.yml: the YAML-list
          # form of ENABLE_LINTERS was not being honored by the runner
          # (every sub-linter for each enabled language still ran), but
          # the env-var form is MegaLinter's native config mechanism and
          # is documented to take priority over everything else.
          ENABLE_LINTERS: ACTION_ACTIONLINT,CSS_STYLELINT,HTML_HTMLHINT,JAVASCRIPT_STANDARD,PYTHON_RUFF,YAML_YAMLLINT
